server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets for a year (what CDNs love)
  location ~* ^/(assets|static|images|icons)/.*\.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Never cache the HTML entrypoint (so deploys show instantly)
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store" always;
  }

  # SPA routing (unchanged from what you had)
  location / {
    try_files $uri /index.html;
  }
}
